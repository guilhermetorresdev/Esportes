spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:/app/data/portal_esporte}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# O esquema de produção só é aceito quando já foi evoluído e validado previamente.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.h2.console.enabled=false
server.forward-headers-strategy=framework
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}

app.upload.dir=${APP_UPLOAD_DIR:/app/videos}
app.upload.imagens.dir=${APP_UPLOAD_IMAGENS_DIR:/app/imagens}
app.almoxarifado.fotos.dir=${ALMOXARIFADO_FOTOS_DIR:/app/data/almoxarifado-fotos}
app.fotos.dir=${FOTOS_CACHE_DIR:/app/data/fotos-oficiais}
app.fotos.habilitado=${FOTOS_SYNC_ENABLED:false}
app.fotos.intervalo-segundos=${FOTOS_SYNC_INTERVALO:7200}
app.conquistas.dir=${CONQUISTAS_CACHE_DIR:/app/data/conquistas-oficiais}
app.conquistas.habilitado=${CONQUISTAS_SYNC_ENABLED:false}
app.conquistas.intervalo-segundos=${CONQUISTAS_SYNC_INTERVALO:3600}
